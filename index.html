<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Intranet Andrés Raíz</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">

  <div class="login-bg"></div>

  <div class="login-card">
    <div class="login-logo">
      <img src="assets/logo.png" alt="Logo Andrés Raíz">
    </div>
    <h1 class="login-title">Intranet</h1>
    <p class="login-subtitle">Andrés Raíz Inmobiliaria</p>

    <form id="loginForm" class="login-form">
      <div class="input-group">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input type="text" id="usuario" placeholder="Usuario" required autocomplete="username">
      </div>
      <div class="input-group">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="clave" placeholder="Contraseña" required autocomplete="current-password">
      </div>
      <button type="submit" id="btnLogin">
        <span id="btnText">Ingresar</span>
        <span id="btnSpinner" class="spinner" style="display:none;"></span>
      </button>
    </form>

    <div id="error" class="login-error"></div>
  </div>

  <footer class="login-footer">
    Andrés Raíz Inmobiliaria S.A.S. &mdash; NIT 901524934
  </footer>

<script>
const EMPLEADOS_CSV_URL = "https://docs.google.com/spreadsheets/d/19AYAQ6KkliEv9drdqEx77AXReXRRwZFwszLpl8NbFgE/gviz/tq?tqx=out:csv&sheet=Hoja%201";

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const btn = document.getElementById("btnLogin");
  const btnText = document.getElementById("btnText");
  const btnSpinner = document.getElementById("btnSpinner");
  const errorEl = document.getElementById("error");

  btn.disabled = true;
  btnText.style.display = "none";
  btnSpinner.style.display = "inline-block";
  errorEl.style.display = "none";

  const usuario = document.getElementById("usuario").value.trim();
  const clave = document.getElementById("clave").value.trim();

  try {
    const res = await fetch(EMPLEADOS_CSV_URL);
    const text = await res.text();
    const data = parseCSV(text);

    const user = data.rows.find(r =>
      (r.usuario || r["usuario "] || '').toString().trim().toLowerCase() === usuario.toLowerCase() &&
      (r.clave || r["clave "] || '').toString().trim() === clave
    );

    if (!user) {
      errorEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> Usuario o contraseña incorrectos';
      errorEl.style.display = "flex";
      btn.disabled = false;
      btnText.style.display = "inline";
      btnSpinner.style.display = "none";
      return;
    }

    const adminVal = (user.admin || user["admin "] || '').toString().trim().toUpperCase();
    const admin = adminVal === 'TRUE' || adminVal === 'VERDADERO' || adminVal === 'SI' || adminVal === '1' || adminVal === 'X';

    const empleado = {
      success: true,
      usuario: user.usuario || user["usuario "],
      nombre: (user.nombre || user["nombre "] || '').toString().trim(),
      cedula: (user.cedula || '').toString().trim(),
      cargo: (user.cargo || '').toString().trim(),
      ingreso: (user.ingreso || '').toString().trim(),
      salario: user.salario || user["salario "] || 0,
      transporte: user.transporte || user["transporte "] || 0,
      rodamiento: user.rodamiento || user["rodamiento "] || 0,
      comisiones: user.comisiones || user["comisiones "] || 0,
      vacaciones: user.vacaciones || user["vacaciones "] || 0,
      genero: (user.genero || user["genero "] || '').toString().trim(),
      admin: admin
    };

    localStorage.setItem("empleado", JSON.stringify(empleado));
    window.location.href = "dashboard.html";

  } catch (error) {
    errorEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> Error al conectar con el servidor';
    errorEl.style.display = "flex";
    btn.disabled = false;
    btnText.style.display = "inline";
    btnSpinner.style.display = "none";
  }
});

function parseCSV(text) {
  const lines = text.split('\n');
  const headers = [];
  const rows = [];
  let i = 0;
  while (i < lines.length) {
    let line = lines[i];
    const fields = [];
    while (line !== undefined) {
      let field = '';
      if (line.startsWith('"')) {
        line = line.substring(1);
        while (line.indexOf('"') !== -1) {
          const idx = line.indexOf('"');
          if (idx + 1 < line.length && line[idx + 1] === '"') {
            field += line.substring(0, idx + 1);
            line = line.substring(idx + 2);
          } else {
            field += line.substring(0, idx);
            line = line.substring(idx + 2);
            break;
          }
        }
      } else {
        const idx = line.indexOf(',');
        if (idx === -1) {
          field = line;
          line = undefined;
        } else {
          field = line.substring(0, idx);
          line = line.substring(idx + 1);
        }
      }
      fields.push(field.trim());
      if (line === '') line = undefined;
    }
    if (i === 0) {
      headers.push(...fields);
    } else {
      if (fields.length > 1 && fields.some(f => f !== '')) {
        const obj = {};
        headers.forEach((h, j) => obj[h] = fields[j] || '');
        rows.push(obj);
      }
    }
    i++;
  }
  return { headers, rows };
}
</script>

</body>
</html>
