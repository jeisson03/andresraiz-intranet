<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Intranet Andrés Raíz</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">

  <div class="login-bg"></div>

  <div class="login-card">
    <div class="login-logo">
      <img src="assets/logo.png" alt="Logo Andrés Raíz">
    </div>
    <h1 class="login-title">Intranet</h1>
    <p class="login-subtitle">Andrés Raíz Inmobiliaria</p>

    <form id="loginForm" class="login-form">
      <div class="input-group">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input type="text" id="usuario" placeholder="Usuario" required autocomplete="username">
      </div>
      <div class="input-group">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="clave" placeholder="Contraseña" required autocomplete="current-password">
      </div>
      <button type="submit" id="btnLogin">
        <span id="btnText">Ingresar</span>
        <span id="btnSpinner" class="spinner" style="display:none;"></span>
      </button>
    </form>

    <div id="error" class="login-error"></div>
  </div>

  <footer class="login-footer">
    Andrés Raíz Inmobiliaria S.A.S. &mdash; NIT 901524934
  </footer>

<script>
const URL_BACKEND = "https://script.google.com/macros/s/AKfycbxP0G9yFjJG9hl2lXQ_3lU2nlWtZch2HPV4-AVqP8FTQi-GqIlQci41oUMOX3JUsEbi/exec";

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const btn = document.getElementById("btnLogin");
  const btnText = document.getElementById("btnText");
  const btnSpinner = document.getElementById("btnSpinner");
  const errorEl = document.getElementById("error");

  btn.disabled = true;
  btnText.style.display = "none";
  btnSpinner.style.display = "inline-block";
  errorEl.style.display = "none";

  const usuario = document.getElementById("usuario").value.trim();
  const clave = document.getElementById("clave").value.trim();

  try {
    const url = URL_BACKEND + "?action=login&usuario=" + encodeURIComponent(usuario) + "&clave=" + encodeURIComponent(clave) + "&secret=andresraiz2026";
    const data = await jsonpFetch(url);

    if (data.error) {
      errorEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> ' + (data.error === "Credenciales incorrectas" ? "Usuario o contraseña incorrectos" : data.error);
      errorEl.style.display = "flex";
      btn.disabled = false;
      btnText.style.display = "inline";
      btnSpinner.style.display = "none";
      return;
    }

    localStorage.setItem("empleado", JSON.stringify(data));
    window.location.href = "dashboard.html";

  } catch (error) {
    errorEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> Error al conectar con el servidor';
    errorEl.style.display = "flex";
    btn.disabled = false;
    btnText.style.display = "inline";
    btnSpinner.style.display = "none";
  }
});

function jsonpFetch(url) {
  return new Promise(function(resolve, reject) {
    var cbName = 'login_cb_' + Math.random().toString(36).substr(2);
    var sep = url.includes('?') ? '&' : '?';
    var script = document.createElement('script');
    window[cbName] = function(data) {
      delete window[cbName];
      document.body.removeChild(script);
      resolve(data);
    };
    script.src = url + sep + 'callback=' + cbName;
    script.onerror = function() {
      delete window[cbName];
      document.body.removeChild(script);
      reject(new Error('JSONP request failed'));
    };
    document.body.appendChild(script);
  });
}
</script>

</body>
</html>
