<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<script>
// =========================
// SESIÓN
// =========================
const empleado = JSON.parse(localStorage.getItem('empleado'));
if (!empleado) window.location.href = "index.html";

// =========================
// DATOS
// =========================
document.getElementById('nombre').innerText = empleado.nombre;
document.getElementById('cedula').innerText = empleado.cedula;
document.getElementById('cargo').innerText = empleado.cargo;

const fecha = new Date(empleado.ingreso);
document.getElementById('ingreso').innerText = fecha.toLocaleDateString('es-CO', {
  year: 'numeric', month: 'long', day: 'numeric'
});

// =========================
// VACACIONES
// =========================
const hoy = new Date();
const meses = (hoy.getFullYear() - fecha.getFullYear()) * 12 + (hoy.getMonth() - fecha.getMonth());

const acumuladas = Math.floor((15 / 12) * meses);
const tomadas = parseInt(empleado.vacaciones || 0);
const disponibles = Math.max(acumuladas - tomadas, 0);

document.getElementById('vacacionesTomadas').innerText = tomadas;
document.getElementById('vacacionesDisponibles').innerText = disponibles;

const porcentaje = acumuladas > 0 ? (tomadas / acumuladas) * 100 : 0;
document.getElementById("progreso").style.width = porcentaje + "%";

// =========================
// FUNCIONES
// =========================
function cerrarSesion() {
  localStorage.removeItem('empleado');
  window.location.href = "index.html";
}

const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/19AYAQ6KkliEv9drdqEx77AXReXRRwZFwszLpl8NbFgE/gviz/tq?tqx=out:csv&sheet=colillas";

function parseCSV(text) {
  const lines = text.split('\n');
  const headers = [];
  const rows = [];
  let i = 0;
  while (i < lines.length) {
    let line = lines[i];
    const fields = [];
    while (line !== undefined) {
      let field = '';
      if (line.startsWith('"')) {
        line = line.substring(1);
        while (line.indexOf('"') !== -1) {
          const idx = line.indexOf('"');
          if (idx + 1 < line.length && line[idx + 1] === '"') {
            field += line.substring(0, idx + 1);
            line = line.substring(idx + 2);
          } else {
            field += line.substring(0, idx);
            line = line.substring(idx + 2);
            break;
          }
        }
      } else {
        const idx = line.indexOf(',');
        if (idx === -1) {
          field = line;
          line = undefined;
        } else {
          field = line.substring(0, idx);
          line = line.substring(idx + 1);
        }
      }
      fields.push(field.trim());
      if (line === '') line = undefined;
    }
    if (i === 0) {
      headers.push(...fields);
    } else {
      const obj = {};
      headers.forEach((h, j) => obj[h] = fields[j] || '');
      rows.push(obj);
    }
    i++;
  }
  return { headers, rows };
}

function cleanCedula(str) {
  return (str || '').toString().replace(/[^0-9]/g, '');
}

function parseNum(str) {
  if (!str) return 0;
  const cleaned = str.toString().replace(/[^0-9\-]/g, '');
  return parseInt(cleaned) || 0;
}

async function descargarColilla() {
  const visor = document.getElementById("visor");

  visor.style.display = "block";
  visor.removeAttribute("src");
  visor.srcdoc = `
    <div style="display:flex;align-items:center;justify-content:center;height:100%;font-family:Segoe UI,sans-serif;color:#888;">
      <p>Cargando colillas...</p>
    </div>
  `;

  try {
    const res = await fetch(SHEET_CSV_URL);
    const text = await res.text();
    const { headers, rows } = parseCSV(text);
    const cedulaLimpia = cleanCedula(empleado.cedula);

    const misColillas = rows.filter(r => {
      const cedulaCol = r['Cedula'] || r['cedula'] || r['Cédula'] || '';
      return cleanCedula(cedulaCol) === cedulaLimpia;
    });

    if (misColillas.length === 0) {
      visor.srcdoc = `
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;font-family:Segoe UI,sans-serif;color:#555;">
          <div style="font-size:48px;margin-bottom:10px;">📄</div>
          <h2 style="margin:0;color:#333;">Sin colillas disponibles</h2>
          <p style="margin-top:8px;">No se encontraron colillas para tu cédula.</p>
          <button onclick="parent.document.getElementById('visor').style.display='none'" style="margin-top:15px;padding:10px 20px;border:none;border-radius:8px;background:#f06c00;color:white;cursor:pointer;font-size:14px;">Cerrar</button>
        </div>
      `;
      return;
    }

    const periodoCol = headers.find(h => h.toLowerCase().includes('periodo')) || 'Periodo';
    const periodos = [...new Set(misColillas.map(r => r[periodoCol] || 'Sin período'))].reverse();

    let selectorHTML = periodos.map((p, i) =>
      `<button class="periodo-btn${i === 0 ? ' active' : ''}" data-periodo="${p}">${p}</button>`
    ).join('');

    visor.srcdoc = `
      <div style="font-family:Segoe UI,sans-serif;padding:20px;color:#333;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
          <h2 style="margin:0;color:#f06c00;">Mis Colillas de Pago</h2>
          <button onclick="parent.document.getElementById('visor').style.display='none'" style="padding:8px 16px;border:none;border-radius:8px;background:#eee;color:#333;cursor:pointer;font-size:13px;">Cerrar</button>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;" id="periodoSelector">
          ${selectorHTML}
        </div>
        <div id="colillaContent"></div>
      </div>
      <style>
        .periodo-btn { padding:8px 16px; border:2px solid #ddd; border-radius:8px; background:white; cursor:pointer; font-size:13px; font-family:Segoe UI,sans-serif; transition:all 0.2s; }
        .periodo-btn:hover { border-color:#f06c00; color:#f06c00; }
        .periodo-btn.active { background:#f06c00; color:white; border-color:#f06c00; }
        .colilla-table { width:100%; border-collapse:collapse; font-size:13px; }
        .colilla-table th { background:#f06c00; color:white; padding:10px 12px; text-align:left; }
        .colilla-table td { padding:8px 12px; border-bottom:1px solid #eee; }
        .colilla-table tr:nth-child(even) { background:#fafafa; }
        .colilla-section { background:white; border:1px solid #eee; border-radius:10px; padding:15px; margin-bottom:15px; }
        .colilla-section h3 { margin:0 0 10px; font-size:15px; color:#f06c00; border-bottom:2px solid #f06c00; padding-bottom:5px; }
        .colilla-total { background:linear-gradient(135deg,#f06c00,#ff9a3c); color:white; padding:15px; border-radius:10px; text-align:center; font-size:18px; font-weight:bold; }
      </style>
      <script>
        const COLILLAS_DATA = ${JSON.stringify(misColillas)};
        const PERIODOS = ${JSON.stringify(periodos)};
        const PERIODO_COL = "${periodoCol}";
        let currentPeriodo = PERIODOS[0] || '';

        function renderColilla(periodo) {
          currentPeriodo = periodo;
          const colilla = COLILLAS_DATA.find(r => (r[PERIODO_COL] || 'Sin período') === periodo);
          if (!colilla) return;

          function fmt(val) {
            const n = parseInt((val || '0').toString().replace(/[^0-9\-]/g, '')) || 0;
            return '$' + n.toLocaleString('es-CO');
          }

          const content = document.getElementById('colillaContent');
          content.innerHTML = \`
            <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
              <button id="btnDescargarColilla" style="padding:10px 20px;border:none;border-radius:8px;background:#28a745;color:white;cursor:pointer;font-size:13px;font-weight:bold;">Descargar PDF</button>
            </div>
            <div class="colilla-section">
              <h3>Datos del Empleado</h3>
              <table class="colilla-table">
                <tr><td><b>Nombre:</b></td><td>\${colilla['Nombre del empleado'] || ''}</td></tr>
                <tr><td><b>Cargo:</b></td><td>\${colilla['Cargo'] || ''}</td></tr>
                <tr><td><b>Salario básico:</b></td><td>\${fmt(colilla['Salario básico'])}</td></tr>
                <tr><td><b>Días liquidados:</b></td><td>\${colilla['Días liquidados'] || ''}</td></tr>
              </table>
            </div>
            <div class="colilla-section">
              <h3>Devengados</h3>
              <table class="colilla-table">
                <tr><td>Salario devengado</td><td style="text-align:right">\${fmt(colilla['Salario devengado'])}</td></tr>
                <tr><td>Horas extras</td><td style="text-align:right">\${fmt(colilla['Horas extras'])}</td></tr>
                <tr><td>Recargos nocturnos</td><td style="text-align:right">\${fmt(colilla['Recargos nocturnos'])}</td></tr>
                <tr><td>% Comisiones salariales</td><td style="text-align:right">\${fmt(colilla['% Comisiones salariales'])}</td></tr>
                <tr><td>Auxilio de transporte</td><td style="text-align:right">\${fmt(colilla['Auxilio de transporte'])}</td></tr>
                <tr><td>Auxilio de rodamiento</td><td style="text-align:right">\${fmt(colilla['Auxilio de rodamiento'])}</td></tr>
                <tr style="font-weight:bold;background:#fff6e6"><td>TOTAL DEVENGADO</td><td style="text-align:right">\${fmt(colilla['Total devengado'])}</td></tr>
              </table>
            </div>
            <div class="colilla-section">
              <h3>Deducciones</h3>
              <table class="colilla-table">
                <tr><td>Salud</td><td style="text-align:right">\${fmt(colilla['Salud'])}</td></tr>
                <tr><td>Pensión</td><td style="text-align:right">\${fmt(colilla['Pensión'])}</td></tr>
                <tr><td>Coopeban</td><td style="text-align:right">\${fmt(colilla['Coopeban'])}</td></tr>
                <tr><td>Retención en la fuente</td><td style="text-align:right">\${fmt(colilla['Retención en la fuente'])}</td></tr>
                <tr><td>Otras deducciones</td><td style="text-align:right">\${fmt(colilla['Otras deducciones'])}</td></tr>
                <tr><td>Rodamiento</td><td style="text-align:right">\${fmt(colilla['Rodamiento'])}</td></tr>
              </table>
            </div>
            <div class="colilla-section">
              <h3>Neto Pagado</h3>
              <div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:14px;">
                <span>Neto pagado:</span><b>\${fmt(colilla['Neto pagado'])}</b>
              </div>
              <div class="colilla-total">
                TOTAL A PAGAR: \${fmt(colilla['Total pagado'])}
              </div>
            </div>
          \`;

          document.getElementById('btnDescargarColilla').addEventListener('click', function() {
            parent.postMessage({ type: 'descargar-colilla', colilla: colilla, periodo: currentPeriodo }, '*');
          });
        }

        document.querySelectorAll('.periodo-btn').forEach(btn => {
          btn.addEventListener('click', function() {
            document.querySelectorAll('.periodo-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentPeriodo = this.dataset.periodo;
            renderColilla(this.dataset.periodo);
          });
        });

        if (PERIODOS.length > 0) renderColilla(PERIODOS[0]);
      <\/script>
    `;
  } catch (error) {
    visor.srcdoc = `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;font-family:Segoe UI,sans-serif;color:#555;">
        <div style="font-size:48px;margin-bottom:10px;">⚠️</div>
        <h2 style="margin:0;color:#c0392b;">Error al cargar colillas</h2>
        <p style="margin-top:8px;">No se pudieron cargar las colillas. Intente de nuevo.</p>
        <button onclick="parent.document.getElementById('visor').style.display='none'" style="margin-top:15px;padding:10px 20px;border:none;border-radius:8px;background:#f06c00;color:white;cursor:pointer;font-size:14px;">Cerrar</button>
      </div>
    `;
  }
}

// =========================
// PDF COLILLA
// =========================
window.addEventListener('message', async (event) => {
  if (event.data && event.data.type === 'descargar-colilla') {
    await generarPDFColilla(event.data.colilla, event.data.periodo);
  }
});

async function generarPDFColilla(colilla, periodo) {
  try {
    const pdfDoc = await PDFLib.PDFDocument.create();
    const page = pdfDoc.addPage([612, 792]);
    const font = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
    const fontBold = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);

    const orange = PDFLib.rgb(240/255, 108/255, 0);
    const dark = PDFLib.rgb(51/255, 51/255, 51/255);
    const lightGray = PDFLib.rgb(240/255, 240/255, 240/255);
    const white = PDFLib.rgb(1, 1, 1);

    let logoImg;
    try {
      const logoRes = await fetch('assets/logo.png');
      const logoBytes = await logoRes.arrayBuffer();
      logoImg = await pdfDoc.embedPng(logoBytes);
    } catch(e) {}

    let y = 740;

    if (logoImg) {
      const logoW = 120;
      const logoH = (logoImg.height / logoImg.width) * logoW;
      page.drawImage(logoImg, { x: 256, y: y - logoH, width: logoW, height: logoH });
      y -= logoH + 10;
    }

    page.drawText('ANDRES RAIZ INMOBILIARIA S.A.S.', {
      x: page.getWidth() / 2 - font.widthOfTextAtSize('ANDRES RAIZ INMOBILIARIA S.A.S.', 14) / 2,
      y, size: 14, font: fontBold, color: dark
    });
    y -= 20;

    page.drawText('COLILLA DE PAGO', {
      x: page.getWidth() / 2 - fontBold.widthOfTextAtSize('COLILLA DE PAGO', 16) / 2,
      y, size: 16, font: fontBold, color: orange
    });
    y -= 20;

    page.drawText(periodo || '', {
      x: page.getWidth() / 2 - font.widthOfTextAtSize(periodo || '', 11) / 2,
      y, size: 11, font, color: dark
    });
    y -= 10;

    page.drawLine({ start: { x: 40, y }, end: { x: 572, y }, thickness: 2, color: orange });
    y -= 25;

    function drawRow(label, value, yPos, isBold) {
      const f = isBold ? fontBold : font;
      page.drawText(label, { x: 50, y: yPos, size: 10, font: f, color: dark });
      page.drawText(value, { x: 400, y: yPos, size: 10, font: f, color: dark });
      return yPos - 18;
    }

    function drawSectionTitle(title, yPos) {

    }

    function fmt(val) {
      const n = parseInt((val || '0').toString().replace(/[^0-9\-]/g, '')) || 0;
      return '$' + n.toLocaleString('es-CO');
    }

    y = drawSectionTitle('DATOS DEL EMPLEADO', y);
    y = drawRow('Nombre:', colilla['Nombre del empleado'] || '', y, false);
    y = drawRow('Cedula:', colilla['Cedula'] || '', y, false);

    y = drawRow('Dias liquidados:', colilla['Dias liquidados'] || colilla['Días liquidados'] || '', y, false);

    y = drawSectionTitle('DEVENGADOS', y);
    y = drawRow('Salario devengado:', fmt(colilla['Salario devengado']), y, false);
    y = drawRow('Horas extras:', fmt(colilla['Horas extras']), y, false);
    y = drawRow('Recargos nocturnos:', fmt(colilla['Recargos nocturnos']), y, false);
    y = drawRow('% Comisiones salariales:', fmt(colilla['% Comisiones salariales']), y, false);
    y = drawRow('Auxilio de transporte:', fmt(colilla['Auxilio de transporte']), y, false);
    y = drawRow('Auxilio de rodamiento:', fmt(colilla['Auxilio de rodamiento']), y, false);

    page.drawLine({ start: { x: 50, y: y + 4 }, end: { x: 562, y: y + 4 }, thickness: 0.5, color: dark });
    y = drawRow('TOTAL DEVENGADO:', fmt(colilla['Total devengado']), y - 2, true);
    y -= 10;

    y = drawSectionTitle('DEDUCCIONES', y);
    y = drawRow('Salud:', fmt(colilla['Salud']), y, false);
    y = drawRow('Pension:', fmt(colilla['Pensión']), y, false);
    y = drawRow('Coopeban:', fmt(colilla['Coopeban']), y, false);
    y = drawRow('Retencion en la fuente:', fmt(colilla['Retención en la fuente']), y, false);
    y = drawRow('Otras deducciones:', fmt(colilla['Otras deducciones']), y, false);
    y = drawRow('Rodamiento:', fmt(colilla['Rodamiento']), y, false);

    y -= 15;
    page.drawLine({ start: { x: 40, y }, end: { x: 572, y }, thickness: 2, color: orange });
    y -= 25;

    y = drawRow('Neto pagado:', fmt(colilla['Neto pagado']), y, true);
    y -= 5;

    page.drawRectangle({ x: 40, y: y - 8, width: 532, height: 30, color: orange, borderColor: orange, borderWidth: 1 });
    page.drawText('TOTAL A PAGAR:  ' + fmt(colilla['Total pagado']), {
      x: page.getWidth() / 2 - fontBold.widthOfTextAtSize('TOTAL A PAGAR:  ' + fmt(colilla['Total pagado']), 13) / 2,
      y: y - 2, size: 13, font: fontBold, color: white
    });

    const pdfBytes = await pdfDoc.save();
    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;

  } catch (error) {

  }
}

function numeroATexto(valor) {
  return new Intl.NumberFormat('es-CO', {
    style: 'currency',
    currency: 'COP',
    minimumFractionDigits: 0
  }).format(valor);
}

function enLetras(n) {
  const UNIDADES = ["", "UNO", "DOS", "TRES", "CUATRO", "CINCO", "SEIS", "SIETE", "OCHO", "NUEVE"];
  const DECENAS = ["", "DIEZ", "VEINTE", "TREINTA", "CUARENTA", "CINCUENTA", "SESENTA", "SETENTA", "OCHENTA", "NOVENTA"];
  const CENTENAS = ["", "CIENTO", "DOSCIENTOS", "TRESCIENTOS", "CUATROCIENTOS", "QUINIENTOS", "SEISCIENTOS", "SETECIENTOS", "OCHOCIENTOS", "NOVECIENTOS"];

  function convertir(n) {
    if (n === 0) return "CERO";
    if (n === 100) return "CIEN";

    let millones = Math.floor(n / 1000000);
    let miles = Math.floor((n % 1000000) / 1000);
    let cientos = n % 1000;

    let resultado = "";

    if (millones > 0) resultado += (millones === 1 ? "UN MILLÓN " : convertir(millones) + " MILLONES ");
    if (miles > 0) resultado += (miles === 1 ? "MIL " : convertir(miles) + " MIL ");

    if (cientos > 0) {
      let c = Math.floor(cientos / 100);
      let d = Math.floor((cientos % 100) / 10);
      let u = cientos % 10;

      if (c > 0) resultado += CENTENAS[c] + " ";

      if (d === 1 && u > 0) {
        resultado += ["DIEZ", "ONCE", "DOCE", "TRECE", "CATORCE", "QUINCE"][u] + " ";
      } else {
        if (d > 0) resultado += DECENAS[d] + (u > 0 ? " Y " : " ");
        if (u > 0) resultado += UNIDADES[u] + " ";
      }
    }
    return resultado.trim();
  }

  return convertir(n) + " PESOS";
}

async function generarCertificado() {
  try {
  const { nombre, cedula, cargo, ingreso, salario, transporte, rodamiento, comisiones } = empleado;

  const fechaActual = new Date().toLocaleDateString("es-CO", {
    year: 'numeric', month: 'long', day: 'numeric'
  });

  const ingresoFecha = new Date(ingreso).toLocaleDateString("es-CO", {
    year: 'numeric', month: 'long', day: 'numeric'
  });

  const existingPdfBytes = await fetch("certificado_base.pdf").then(res => res.arrayBuffer());
  const pdfDoc = await PDFLib.PDFDocument.load(existingPdfBytes);
  const page = pdfDoc.getPages()[0];

  const font = await pdfDoc.embedFont(PDFLib.StandardFonts.TimesRoman);

  const left = 75;
  const maxWidth = 420;
  const fontSize = 9.5;
  const lineHeight = 16;

  let y = 675; // 🔥 equilibrio perfecto

  function drawParagraph(text, extraY = 10) {
    const words = text.split(" ");
    let line = "";

    for (let word of words) {
      const testLine = line + word + " ";
      const width = font.widthOfTextAtSize(testLine, fontSize);

      if (width > maxWidth) {
        page.drawText(line.trim(), { x: left, y, size: fontSize, font });
        y -= lineHeight;
        line = word + " ";
      } else {
        line = testLine;
      }
    }

    if (line.trim()) {
      page.drawText(line.trim(), { x: left, y, size: fontSize, font });
      y -= lineHeight;
    }

    y -= extraY;
  }

  drawParagraph(`Sabaneta, ${fechaActual}`, 25);
  drawParagraph(`A QUIEN PUEDA INTERESAR`, 30);

  drawParagraph(
    `ANDRÉS RAÍZ INMOBILIARIA S.A.S., con NIT 901524934, certifica que el señor(a) ${nombre}, identificado con cédula de ciudadanía No. ${cedula}, labora en nuestra compañía desde el ${ingresoFecha} hasta la fecha bajo el cargo de ${cargo} mediante contrato a término indefinido.`,
    20
  );

  let remuneracion =
    `Su remuneración se compone de: salario básico de ${enLetras(salario)} (${numeroATexto(salario)})`;

  if (transporte > 0)
    remuneracion += `, auxilio de transporte de ${enLetras(transporte)} (${numeroATexto(transporte)})`;

  if (rodamiento > 0)
    remuneracion += `, auxilio de rodamiento de ${enLetras(rodamiento)} (${numeroATexto(rodamiento)})`;

  if (comisiones > 0)
    remuneracion += `, recibe a la fecha un promedio de salario variable de ${enLetras(comisiones)} (${numeroATexto(comisiones)})`;

  remuneracion += ".";

  drawParagraph(remuneracion, 20);

  drawParagraph(
    `Este certificado se expide a solicitud del interesado para los fines que estime convenientes. Para cualquier información adicional, puede comunicarse al correo servicio@andresraiz.com o a los teléfonos 358 85 64 y 3245366761.`,
    40
  );

  const pdfBytes = await pdfDoc.save();
  const blob = new Blob([pdfBytes], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);

  document.getElementById('visor').style.display = 'block';
  document.getElementById('visor').removeAttribute('srcdoc');
  document.getElementById('visor').src = url;

  const boton = document.getElementById('btnDescargar');
  boton.style.display = 'block';

  boton.onclick = () => {
    const a = document.createElement('a');
    a.href = url;
    a.download = `Certificado_${nombre}.pdf`;
    a.click();
  };
  } catch (error) {
    const visor = document.getElementById('visor');
    visor.style.display = 'block';
    visor.srcdoc = `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;font-family:Segoe UI,sans-serif;color:#555;">
        <div style="font-size:48px;margin-bottom:10px;">⚠️</div>
        <h2 style="margin:0;color:#c0392b;">Error al generar certificado</h2>
        <p style="margin-top:8px;">No se pudo generar el certificado. Intente de nuevo.</p>
        <button onclick="parent.document.getElementById('visor').style.display='none'" style="margin-top:15px;padding:10px 20px;border:none;border-radius:8px;background:#f06c00;color:white;cursor:pointer;font-size:14px;">Cerrar</button>
      </div>
    `;
  }
}

// =========================
// SOLICITUD VACACIONES
// =========================
const VAC_SCRIPT_URL = '';
const CLAVE_SECRETA = 'andresraiz2026';

function abrirSolicitudVacaciones() {
  document.getElementById('modalVacaciones').style.display = 'flex';
  cargarDisponiblesVacaciones();
  document.getElementById('vacFechaInicio').value = '';
  document.getElementById('vacFechaFin').value = '';
  document.getElementById('vacMotivo').value = '';
  document.getElementById('vacDiasInfo').style.display = 'none';
}

function cerrarModalVacaciones() {
  document.getElementById('modalVacaciones').style.display = 'none';
}

async function cargarDisponiblesVacaciones() {
  if (!VAC_SCRIPT_URL) {
    const fechaIngreso = new Date(empleado.ingreso);
    const hoy = new Date();
    const meses = (hoy.getFullYear() - fechaIngreso.getFullYear()) * 12 + (hoy.getMonth() - fechaIngreso.getMonth());
    const acumuladas = Math.floor((15 / 12) * meses);
    const tomadas = parseInt(empleado.vacaciones || 0);
    const disponibles = Math.max(acumuladas - tomadas, 0);
    document.getElementById('vacDispDisponibles').innerText = disponibles;
    document.getElementById('vacDispTomadas').innerText = tomadas;
    document.getElementById('vacDispAcumuladas').innerText = acumuladas;
    return;
  }
  try {
    const res = await fetch(VAC_SCRIPT_URL + '?action=disponibles&cedula=' + empleado.cedula + '&clave=' + CLAVE_SECRETA);
    const data = await res.json();
    document.getElementById('vacDispDisponibles').innerText = data.disponibles;
    document.getElementById('vacDispTomadas').innerText = data.tomadas;
    document.getElementById('vacDispAcumuladas').innerText = data.acumuladas;
  } catch(e) {
    abrirSolicitudVacaciones();
  }
}

function calcularDiasVacaciones() {
  const inicio = document.getElementById('vacFechaInicio').value;
  const fin = document.getElementById('vacFechaFin').value;
  if (inicio && fin) {
    const dInicio = new Date(inicio);
    const dFin = new Date(fin);
    if (dFin >= dInicio) {
      const dias = Math.ceil((dFin - dInicio) / (1000 * 60 * 60 * 24)) + 1;
      document.getElementById('vacDiasInfo').style.display = 'block';
      document.getElementById('vacDiasNum').innerText = dias;
    }
  }
}

async function enviarSolicitudVacaciones() {
  const fechaInicio = document.getElementById('vacFechaInicio').value;
  const fechaFin = document.getElementById('vacFechaFin').value;
  const motivo = document.getElementById('vacMotivo').value.trim();

  if (!fechaInicio || !fechaFin) {
    alert('Selecciona las fechas de inicio y fin');
    return;
  }
  if (!motivo) {
    alert('Escribe el motivo de tu solicitud');
    return;
  }

  const dInicio = new Date(fechaInicio);
  const dFin = new Date(fechaFin);
  if (dFin < dInicio) {
    alert('La fecha de fin no puede ser anterior a la de inicio');
    return;
  }

  const dias = Math.ceil((dFin - dInicio) / (1000 * 60 * 60 * 24)) + 1;
  const fechaInicioFmt = dInicio.toLocaleDateString('es-CO');
  const fechaFinFmt = dFin.toLocaleDateString('es-CO');

  if (!VAC_SCRIPT_URL) {
    alert('Solicitud enviada (modo demo).\n\nPara conectar con el backend, configura la URL de Google Apps Script.');
    cerrarModalVacaciones();
    return;
  }

  try {
    const res = await fetch(VAC_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        clave: CLAVE_SECRETA,
        cedula: empleado.cedula,
        nombre: empleado.nombre,
        fechaInicio: fechaInicioFmt,
        fechaFin: fechaFinFmt,
        dias: dias,
        motivo: motivo
      })
    });
    const data = await res.json();
    if (data.success) {
      alert('Solicitud enviada exitosamente');
      cerrarModalVacaciones();
      cargarHistorialSolicitudes();
    }
  } catch(e) {
    alert('Error al enviar la solicitud');
  }
}

async function cargarHistorialSolicitudes() {
  const container = document.getElementById('listaSolicitudes');

  if (!VAC_SCRIPT_URL) {
    container.innerHTML = '<p class="vac-empty">No hay solicitudes registradas</p>';
    return;
  }

  try {
    const res = await fetch(VAC_SCRIPT_URL + '?action=solicitudes&cedula=' + empleado.cedula + '&clave=' + CLAVE_SECRETA);
    const data = await res.json();

    if (data.data.length === 0) {
      container.innerHTML = '<p class="vac-empty">No hay solicitudes registradas</p>';
      return;
    }

    const solicitudes = data.data.reverse();
    container.innerHTML = solicitudes.map(s => {
      let estadoClass = 'vac-estado-pendiente';
      let estadoIcono = '⏳';
      if (s.Estado === 'Aprobada') { estadoClass = 'vac-estado-aprobada'; estadoIcono = '✅'; }
      if (s.Estado === 'Rechazada') { estadoClass = 'vac-estado-rechazada'; estadoIcono = '❌'; }

      return `
        <div class="vac-solicitud-item">
          <div class="vac-solicitud-top">
            <span class="vac-solicitud-fechas">${s['Fecha Inicio']} - ${s['Fecha Fin']}</span>
            <span class="vac-solicitud-dias">${s.Dias} días</span>
          </div>
          <div class="vac-solicitud-motivo">${s.Motivo}</div>
          <div class="vac-solicitud-bottom">
            <span class="vac-solicitud-fecha">Solicitado: ${s['Fecha Solicitud']}</span>
            <span class="vac-solicitud-estado ${estadoClass}">${estadoIcono} ${s.Estado}</span>
          </div>
          ${s.Observaciones ? `<div class="vac-solicitud-obs"><b>Observaciones:</b> ${s.Observaciones}</div>` : ''}
        </div>
      `;
    }).join('');
  } catch(e) {
    container.innerHTML = '<p class="vac-empty">Error al cargar solicitudes</p>';
  }
}

cargarHistorialSolicitudes();
