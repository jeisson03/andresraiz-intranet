<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel - Andrés Raíz</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dash-body">

<div class="dash-container">
  <div class="dash-header">
    <div class="dash-header-top">
      <img src="assets/logo.png" class="dash-logo">
      <button class="dash-logout" onclick="cerrarSesion()">

      </button>
    </div>
    <h2 class="dash-greeting">Hola, <span id="nombre"></span></h2>
    <p class="dash-sub">Bienvenido a tu panel</p>
  </div>

  <div class="dash-card">
    <div class="dash-info-row">
      <div class="dash-info-item">
        <div class="dash-info-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div>
          <span class="dash-info-label">Cedula</span>
          <span class="dash-info-value" id="cedula"></span>
        </div>
      </div>
      <div class="dash-info-item">
        <div class="dash-info-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
        </div>
        <div>
          <span class="dash-info-label">Cargo</span>
          <span class="dash-info-value" id="cargo"></span>
        </div>
      </div>
      <div class="dash-info-item">
        <div class="dash-info-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <div>
          <span class="dash-info-label">Ingreso</span>

  </div>

  <div class="dash-card">
    <div class="dash-vac-header">
      <div class="dash-vac-icon">

      </div>
      <span class="dash-vac-title">Vacaciones</span>
    </div>
    <div class="dash-barra">
      <div id="progreso" class="dash-progreso"></div>
    </div>
    <div class="dash-vac-info">
      <div class="dash-vac-stat">
        <span class="dash-vac-num" id="vacacionesTomadas">0</span>
        <span class="dash-vac-label">Usados</span>
      </div>
      <div class="dash-vac-stat">
        <span class="dash-vac-num highlight" id="vacacionesDisponibles">0</span>
        <span class="dash-vac-label">Disponibles</span>
      </div>
    </div>
  </div>

  <div class="dash-card" id="vacacionesColectivasCard" style="display:none;">
    <div class="dash-vac-header">
      <div class="dash-vac-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
      <span class="dash-vac-title">Vacaciones Colectivas</span>
    </div>
    <div id="listaColectivas" style="padding: 0 10px;"></div>
  </div>

  <div class="dash-btn-group">
    <button class="dash-btn dash-btn-primary" onclick="descargarColilla()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Ver colilla
    </button>
    <button class="dash-btn dash-btn-secondary" onclick="generarCertificado()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M12 18v-6"/><path d="M9 15l3 3 3-3"/></svg>
      Generar certificado
    </button>
    <button class="dash-btn dash-btn-vacation" onclick="abrirSolicitudVacaciones()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Solicitar semana de vacaciones
    </button>
    <button id="btnAdmin" class="dash-btn dash-btn-admin" style="display:none;" onclick="window.open('admin.html','_blank')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Panel Admin
    </button>
    <button id="btnDescargar" class="dash-btn dash-btn-success" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Descargar certificado
    </button>
  </div>

  <iframe id="visor"></iframe>

  <!-- MODAL SOLICITUD VACACIONES -->
  <div id="modalVacaciones" class="vac-modal" style="display:none;">
    <div class="vac-modal-content">
      <div class="vac-modal-header">
        <h3>Solicitar Vacaciones</h3>
        <button class="vac-modal-close" onclick="cerrarModalVacaciones()">&times;</button>
      </div>
      <div class="vac-modal-body">
        <div class="vac-disponibles-info">
          <div class="vac-disp-item">
            <span class="vac-disp-num" id="vacDispDisponibles">0</span>
            <span class="vac-disp-label">Disponibles</span>
          </div>
          <div class="vac-disp-item">
            <span class="vac-disp-num" id="vacDispTomadas">0</span>
            <span class="vac-disp-label">Tomados</span>
          </div>
          <div class="vac-disp-item">
            <span class="vac-disp-num" id="vacDispAcumuladas">0</span>
            <span class="vac-disp-label">Acumulados</span>
          </div>
          <div class="vac-disp-item">
            <span class="vac-disp-num" id="vacDispColectivas" style="color:#e74c3c;">0</span>
            <span class="vac-disp-label">Colectivas</span>
          </div>
        </div>
        <div class="vac-form-group">
          <label>Semana de vacaciones (lunes a domingo)</label>
          <input type="date" id="vacFechaInicio" onchange="onSelectFechaInicio()">
        </div>
        <div class="vac-dias-info" id="vacDiasInfo" style="display:none;">
          <div style="font-size:18px;font-weight:800;color:#5a4bd1;">7 días — lunes a domingo</div>
        </div>
        <div class="vac-form-group">
          <label>Motivo</label>
          <textarea id="vacMotivo" rows="3" placeholder="Describe el motivo de tu solicitud..."></textarea>
        </div>
        <button class="vac-btn-submit" id="btnEnviarSolicitud" onclick="enviarSolicitudVacaciones()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          Enviar solicitud
        </button>
      </div>
    </div>
  </div>

  <!-- HISTORIAL SOLICITUDES -->
  <div class="vac-card" id="historialSolicitudes">
    <div class="vac-card-header">
      <div class="vac-card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      </div>
      <span class="vac-card-title">Mis solicitudes</span>
    </div>
    <div id="listaSolicitudes">
      <p class="vac-empty">Cargando solicitudes...</p>
    </div>
  </div>

  <footer class="dash-footer">
    Andres Raiz Inmobiliaria S.A.S.
  </footer>
</div>

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<script>
// =========================
// SESIÓN
// =========================
const empleado = JSON.parse(localStorage.getItem('empleado'));
if (!empleado) window.location.href = "index.html";

const VAC_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxP0G9yFjJG9hl2lXQ_3lU2nlWtZch2HPV4-AVqP8FTQi-GqIlQci41oUMOX3JUsEbi/exec';
const CLAVE_SECRETA = 'andresraiz2026';

// =========================
// DATOS
// =========================
document.getElementById('nombre').innerText = empleado.nombre;
document.getElementById('cedula').innerText = empleado.cedula;
document.getElementById('cargo').innerText = empleado.cargo;

function parseFechaCO(str) {
  str = (str || '').trim();
  const m = str.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
  return new Date(str);
}

const fecha = parseFechaCO(empleado.ingreso);
document.getElementById('ingreso').innerText = fecha.toLocaleDateString('es-CO', {
  year: 'numeric', month: 'long', day: 'numeric'
});

// =========================
// VACACIONES
// =========================
const hoyDash = new Date();
const mesesDash = (hoyDash.getFullYear() - fecha.getFullYear()) * 12 + (hoyDash.getMonth() - fecha.getMonth());

const acumuladasDash = Math.floor((15 / 12) * mesesDash);
const tomadasDash = parseInt(empleado.vacaciones || 0);
const disponiblesDash = Math.max(acumuladasDash - tomadasDash, 0);

document.getElementById('vacacionesTomadas').innerText = tomadasDash;
document.getElementById('vacacionesDisponibles').innerText = disponiblesDash;

const porcentajeDash = acumuladasDash > 0 ? (tomadasDash / acumuladasDash) * 100 : 0;
document.getElementById("progreso").style.width = porcentajeDash + "%";

(function() {
  var url = VAC_SCRIPT_URL + '?clave=' + CLAVE_SECRETA + '&action=disponibles&cedula=' + encodeURIComponent(empleado.cedula);
  jsonpFetch(url).then(function(data) {
    if (data.disponibles !== undefined) {
      document.getElementById('vacacionesDisponibles').innerText = data.disponibles;
      document.getElementById('vacacionesTomadas').innerText = data.tomadas || tomadasDash;
      var total = data.acumuladas || acumuladasDash;
      var usados = data.tomadas || tomadasDash;
      document.getElementById("progreso").style.width = (total > 0 ? (usados / total) * 100 : 0) + "%";
    }
  }).catch(function() {});
})();

if (empleado.admin === true || empleado.admin === 'TRUE' || empleado.admin === 'true' || empleado.admin === true) {
  document.getElementById('btnAdmin').style.display = 'flex';
}

// =========================
// FUNCIONES
// =========================
function cerrarSesion() {
  localStorage.removeItem('empleado');
  window.location.href = "index.html";
}

const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/19AYAQ6KkliEv9drdqEx77AXReXRRwZFwszLpl8NbFgE/gviz/tq?tqx=out:csv&sheet=colillas";

function parseCSV(text) {
  const lines = text.split('\n');
  const headers = [];
  const rows = [];
  let i = 0;
  while (i < lines.length) {
    let line = lines[i];
    const fields = [];
    while (line !== undefined) {
      let field = '';
      if (line.startsWith('"')) {
        line = line.substring(1);
        while (line.indexOf('"') !== -1) {
          const idx = line.indexOf('"');
          if (idx + 1 < line.length && line[idx + 1] === '"') {
            field += line.substring(0, idx + 1);
            line = line.substring(idx + 2);
          } else {
            field += line.substring(0, idx);
            line = line.substring(idx + 2);
            break;
          }
        }
      } else {
        const idx = line.indexOf(',');
        if (idx === -1) {
          field = line;
          line = undefined;
        } else {
          field = line.substring(0, idx);
          line = line.substring(idx + 1);
        }
      }
      fields.push(field.trim());
      if (line === '') line = undefined;
    }
    if (i === 0) {
      headers.push(...fields);
    } else {
      const obj = {};
      headers.forEach((h, j) => obj[h] = fields[j] || '');
      rows.push(obj);
    }
    i++;
  }
  return { headers, rows };
}

function cleanCedula(str) {
  return (str || '').toString().replace(/[^0-9]/g, '');
}

function parseNum(str) {
  if (!str) return 0;
  const cleaned = str.toString().replace(/[^0-9\-]/g, '');
  return parseInt(cleaned) || 0;
}

async function descargarColilla() {
  const visor = document.getElementById("visor");

  visor.style.display = "block";
  visor.removeAttribute("src");
  visor.srcdoc = `
    <div style="display:flex;align-items:center;justify-content:center;height:100%;font-family:Segoe UI,sans-serif;color:#888;">
      <p>Cargando colillas...</p>
    </div>
  `;

  try {
    const res = await fetch(SHEET_CSV_URL);
    const text = await res.text();
    const { headers, rows } = parseCSV(text);
    const cedulaLimpia = cleanCedula(empleado.cedula);

    const misColillas = rows.filter(r => {
      const cedulaCol = r['Cedula'] || r['cedula'] || r['Cédula'] || '';
      return cleanCedula(cedulaCol) === cedulaLimpia;
    });

    if (misColillas.length === 0) {
      visor.srcdoc = `
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;font-family:Segoe UI,sans-serif;color:#555;">
          <div style="font-size:48px;margin-bottom:10px;">📄</div>
          <h2 style="margin:0;color:#333;">Sin colillas disponibles</h2>
          <p style="margin-top:8px;">No se encontraron colillas para tu cédula.</p>
          <button onclick="parent.document.getElementById('visor').style.display='none'" style="margin-top:15px;padding:10px 20px;border:none;border-radius:8px;background:#f06c00;color:white;cursor:pointer;font-size:14px;">Cerrar</button>
        </div>
      `;
      return;
    }

    const periodoCol = headers.find(h => h.toLowerCase().includes('periodo')) || 'Periodo';
    const periodos = [...new Set(misColillas.map(r => r[periodoCol] || 'Sin período'))].reverse();

    let selectorHTML = periodos.map((p, i) =>
      `<button class="periodo-btn${i === 0 ? ' active' : ''}" data-periodo="${p}">${p}</button>`
    ).join('');

    visor.srcdoc = `
      <div style="font-family:Segoe UI,sans-serif;padding:20px;color:#333;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
          <h2 style="margin:0;color:#f06c00;">Mis Colillas de Pago</h2>
          <button onclick="parent.document.getElementById('visor').style.display='none'" style="padding:8px 16px;border:none;border-radius:8px;background:#eee;color:#333;cursor:pointer;font-size:13px;">Cerrar</button>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;" id="periodoSelector">
          ${selectorHTML}
        </div>
        <div id="colillaContent"></div>
      </div>
      <style>
        .periodo-btn { padding:8px 16px; border:2px solid #ddd; border-radius:8px; background:white; cursor:pointer; font-size:13px; font-family:Segoe UI,sans-serif; transition:all 0.2s; }
        .periodo-btn:hover { border-color:#f06c00; color:#f06c00; }
        .periodo-btn.active { background:#f06c00; color:white; border-color:#f06c00; }
        .colilla-table { width:100%; border-collapse:collapse; font-size:13px; }
        .colilla-table th { background:#f06c00; color:white; padding:10px 12px; text-align:left; }
        .colilla-table td { padding:8px 12px; border-bottom:1px solid #eee; }
        .colilla-table tr:nth-child(even) { background:#fafafa; }
        .colilla-section { background:white; border:1px solid #eee; border-radius:10px; padding:15px; margin-bottom:15px; }
        .colilla-section h3 { margin:0 0 10px; font-size:15px; color:#f06c00; border-bottom:2px solid #f06c00; padding-bottom:5px; }
        .colilla-total { background:linear-gradient(135deg,#f06c00,#ff9a3c); color:white; padding:15px; border-radius:10px; text-align:center; font-size:18px; font-weight:bold; }
      </style>
      <script>
        const COLILLAS_DATA = ${JSON.stringify(misColillas)};
        const PERIODOS = ${JSON.stringify(periodos)};
        const PERIODO_COL = "${periodoCol}";
        let currentPeriodo = PERIODOS[0] || '';

        function renderColilla(periodo) {
          currentPeriodo = periodo;
          const colilla = COLILLAS_DATA.find(r => (r[PERIODO_COL] || 'Sin período') === periodo);
          if (!colilla) return;

          function fmt(val) {
            const n = parseInt((val || '0').toString().replace(/[^0-9\-]/g, '')) || 0;
            return '$' + n.toLocaleString('es-CO');
          }

          function salarioDevengado() {
            let val = colilla['Salario devengado'];
            const bruto = (val || '').toString().trim();
            if (bruto !== '' && bruto !== '-' && bruto !== '$') {
              const parsed = parseInt(bruto.replace(/[^0-9\-]/g, '')) || 0;
              if (parsed > 0) return parsed;
            }
            const basico = parseInt((colilla['Salario básico'] || '0').toString().replace(/[^0-9\-]/g, '')) || 0;
            const dias = parseInt((colilla['Días liquidados'] || '0').toString().replace(/[^0-9]/g, '')) || 0;
            return Math.round(basico / 30 * dias);
          }

          const content = document.getElementById('colillaContent');
          content.innerHTML = \`
            <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
              <button id="btnDescargarColilla" style="padding:10px 20px;border:none;border-radius:8px;background:#28a745;color:white;cursor:pointer;font-size:13px;font-weight:bold;">Descargar PDF</button>
            </div>
            <div class="colilla-section">
              <h3>Datos del Empleado</h3>
              <table class="colilla-table">
                <tr><td><b>Nombre:</b></td><td>\${colilla['Nombre del empleado'] || ''}</td></tr>
                <tr><td><b>Cargo:</b></td><td>\${colilla['Cargo'] || ''}</td></tr>
                <tr><td><b>Salario básico:</b></td><td>\${fmt(colilla['Salario básico'])}</td></tr>
                <tr><td><b>Días liquidados:</b></td><td>\${colilla['Días liquidados'] || ''}</td></tr>
              </table>
            </div>
            <div class="colilla-section">
              <h3>Devengados</h3>
              <table class="colilla-table">
                <tr><td>Salario devengado</td><td style="text-align:right">\${fmt(salarioDevengado())}</td></tr>
                <tr><td>Horas extras</td><td style="text-align:right">\${fmt(colilla['Horas extras'])}</td></tr>
                <tr><td>Recargos nocturnos</td><td style="text-align:right">\${fmt(colilla['Recargos nocturnos'])}</td></tr>
                <tr><td>% Comisiones salariales</td><td style="text-align:right">\${fmt(colilla['% Comisiones salariales'])}</td></tr>
                <tr><td>Auxilio de transporte</td><td style="text-align:right">\${fmt(colilla['Auxilio de transporte'])}</td></tr>
                <tr><td>Auxilio de rodamiento</td><td style="text-align:right">\${fmt(colilla['Auxilio de rodamiento'])}</td></tr>
                <tr style="font-weight:bold;background:#fff6e6"><td>TOTAL DEVENGADO</td><td style="text-align:right">\${fmt(colilla['Total devengado'])}</td></tr>
              </table>
            </div>
            <div class="colilla-section">
              <h3>Deducciones</h3>
              <table class="colilla-table">
                <tr><td>Salud</td><td style="text-align:right">\${fmt(colilla['Salud'])}</td></tr>
                <tr><td>Pensión</td><td style="text-align:right">\${fmt(colilla['Pensión'])}</td></tr>
                <tr><td>Coopeban</td><td style="text-align:right">\${fmt(colilla['Coopeban'])}</td></tr>
                <tr><td>Retención en la fuente</td><td style="text-align:right">\${fmt(colilla['Retención en la fuente'])}</td></tr>
                <tr><td>Otras deducciones</td><td style="text-align:right">\${fmt(colilla['Otras deducciones'])}</td></tr>
                <tr><td>Rodamiento</td><td style="text-align:right">\${fmt(colilla['Rodamiento'])}</td></tr>
              </table>
            </div>
            <div class="colilla-section">
              <h3>Neto Pagado</h3>
              <div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:14px;">
                <span>Neto pagado:</span><b>\${fmt(colilla['Neto pagado'])}</b>
              </div>
              <div class="colilla-total">
                TOTAL A PAGAR: \${fmt(colilla['Total pagado'])}
              </div>
            </div>
          \`;

          document.getElementById('btnDescargarColilla').addEventListener('click', function() {
            parent.postMessage({ type: 'descargar-colilla', colilla: colilla, periodo: currentPeriodo }, '*');
          });
        }

        document.querySelectorAll('.periodo-btn').forEach(btn => {
          btn.addEventListener('click', function() {
            document.querySelectorAll('.periodo-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentPeriodo = this.dataset.periodo;
            renderColilla(this.dataset.periodo);
          });
        });

        if (PERIODOS.length > 0) renderColilla(PERIODOS[0]);
      <\/script>

async function generarPDFColilla(colilla, periodo) {

    const dark = PDFLib.rgb(51/255, 51/255, 51/255);
    const lightGray = PDFLib.rgb(240/255, 240/255, 240/255);
    const white = PDFLib.rgb(1, 1, 1);

    let logoImg;
    try {
      const logoRes = await fetch('assets/logo.png');
      const logoBytes = await logoRes.arrayBuffer();
      logoImg = await pdfDoc.embedPng(logoBytes);
    } catch(e) {}

    let y = 740;

    if (logoImg) {
      const logoW = 120;
      const logoH = (logoImg.height / logoImg.width) * logoW;
      page.drawImage(logoImg, { x: 256, y: y - logoH, width: logoW, height: logoH });
      y -= logoH + 10;
    }

    page.drawText('ANDRES RAIZ INMOBILIARIA S.A.S.', {
      x: page.getWidth() / 2 - font.widthOfTextAtSize('ANDRES RAIZ INMOBILIARIA S.A.S.', 14) / 2,
      y, size: 14, font: fontBold, color: dark
    });
    y -= 20;

    page.drawText('COLILLA DE PAGO', {
      x: page.getWidth() / 2 - fontBold.widthOfTextAtSize('COLILLA DE PAGO', 16) / 2,
      y, size: 16, font: fontBold, color: orange
    });
    y -= 20;

    page.drawText(periodo || '', {
      x: page.getWidth() / 2 - font.widthOfTextAtSize(periodo || '', 11) / 2,
      y, size: 11, font, color: dark
    });
    y -= 10;

    page.drawLine({ start: { x: 40, y }, end: { x: 572, y }, thickness: 2, color: orange });
    y -= 25;

    function drawRow(label, value, yPos, isBold) {
      const f = isBold ? fontBold : font;
      page.drawText(label, { x: 50, y: yPos, size: 10, font: f, color: dark });
      page.drawText(value, { x: 400, y: yPos, size: 10, font: f, color: dark });
      return yPos - 18;
    }

    function drawSectionTitle(title, yPos) {
      page.drawRectangle({ x: 40, y: yPos - 4, width: 532, height: 22, color: orange });
      page.drawText(title, { x: 50, y: yPos, size: 11, font: fontBold, color: white });
      return yPos - 28;
    }

    function fmt(val) {
      const n = parseInt((val || '0').toString().replace(/[^0-9\-]/g, '')) || 0;
      return '$' + n.toLocaleString('es-CO');
    }

    function salarioDevengadoColilla(colilla) {
      const bruto = (colilla['Salario devengado'] || '').toString().trim();
      if (bruto !== '' && bruto !== '-' && bruto !== '$') {
        const parsed = parseInt(bruto.replace(/[^0-9\-]/g, '')) || 0;
        if (parsed > 0) return parsed;
      }
      const basico = parseInt((colilla['Salario básico'] || '0').toString().replace(/[^0-9\-]/g, '')) || 0;
      const dias = parseInt((colilla['Días liquidados'] || '0').toString().replace(/[^0-9]/g, '')) || 0;
      return Math.round(basico / 30 * dias);
    }

    y = drawSectionTitle('DATOS DEL EMPLEADO', y);
    y = drawRow('Nombre:', colilla['Nombre del empleado'] || '', y, false);
    y = drawRow('Cedula:', colilla['Cedula'] || '', y, false);
    y = drawRow('Cargo:', colilla['Cargo'] || '', y, false);
    y = drawRow('Dias liquidados:', colilla['Dias liquidados'] || colilla['Días liquidados'] || '', y, false);
    y -= 10;

    y = drawSectionTitle('DEVENGADOS', y);
    y = drawRow('Salario devengado:', fmt(salarioDevengadoColilla(colilla)), y, false);
    y = drawRow('Horas extras:', fmt(colilla['Horas extras']), y, false);
    y = drawRow('Recargos nocturnos:', fmt(colilla['Recargos nocturnos']), y, false);
    y = drawRow('% Comisiones salariales:', fmt(colilla['% Comisiones salariales']), y, false);
    y = drawRow('Auxilio de transporte:', fmt(colilla['Auxilio de transporte']), y, false);
    y = drawRow('Auxilio de rodamiento:', fmt(colilla['Auxilio de rodamiento']), y, false);

    page.drawLine({ start: { x: 50, y: y + 4 }, end: { x: 562, y: y + 4 }, thickness: 0.5, color: dark });
    y = drawRow('TOTAL DEVENGADO:', fmt(colilla['Total devengado']), y - 2, true);
    y -= 10;

    y = drawSectionTitle('DEDUCCIONES', y);
    y = drawRow('Salud:', fmt(colilla['Salud']), y, false);
    y = drawRow('Pension:', fmt(colilla['Pensión']), y, false);
    y = drawRow('Coopeban:', fmt(colilla['Coopeban']), y, false);
    y = drawRow('Retencion en la fuente:', fmt(colilla['Retención en la fuente']), y, false);
    y = drawRow('Otras deducciones:', fmt(colilla['Otras deducciones']), y, false);
    y = drawRow('Rodamiento:', fmt(colilla['Rodamiento']), y, false);

    y -= 15;
    page.drawLine({ start: { x: 40, y }, end: { x: 572, y }, thickness: 2, color: orange });
    y -= 25;

    y = drawRow('Neto pagado:', fmt(colilla['Neto pagado']), y, true);
    y -= 5;

    page.drawRectangle({ x: 40, y: y - 8, width: 532, height: 30, color: orange, borderColor: orange, borderWidth: 1 });
    page.drawText('TOTAL A PAGAR:  ' + fmt(colilla['Total pagado']), {
      x: page.getWidth() / 2 - fontBold.widthOfTextAtSize('TOTAL A PAGAR:  ' + fmt(colilla['Total pagado']), 13) / 2,
      y: y - 2, size: 13, font: fontBold, color: white
    });

  pdfDoc.setTitle(`Certificado Laboral - ${nombre}`);
  pdfDoc.setAuthor("Andrés Raíz Inmobiliaria S.A.S.");
  pdfDoc.setSubject("Certificado laboral");
  pdfDoc.setKeywords(["certificado", "laboral", "empleado"]);

  const pdfBytes = await pdfDoc.save();
    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Colilla_${(periodo || 'pago').replace(/\s+/g, '_')}.pdf`;
    a.click();
    URL.revokeObjectURL(url);
  } catch (error) {
    alert('Error al generar el PDF: ' + error.message);
  }
}

function numeroATexto(valor) {
  return new Intl.NumberFormat('es-CO', {
    style: 'currency',
    currency: 'COP',
    minimumFractionDigits: 0
  }).format(valor);
}

function enLetras(n) {
  const UNIDADES = ["", "UNO", "DOS", "TRES", "CUATRO", "CINCO", "SEIS", "SIETE", "OCHO", "NUEVE"];
  const DECENAS = ["", "DIEZ", "VEINTE", "TREINTA", "CUARENTA", "CINCUENTA", "SESENTA", "SETENTA", "OCHENTA", "NOVENTA"];
  const CENTENAS = ["", "CIENTO", "DOSCIENTOS", "TRESCIENTOS", "CUATROCIENTOS", "QUINIENTOS", "SEISCIENTOS", "SETECIENTOS", "OCHOCIENTOS", "NOVECIENTOS"];

  function convertir(n) {
    if (n === 0) return "CERO";
    if (n === 100) return "CIEN";

    let millones = Math.floor(n / 1000000);
    let miles = Math.floor((n % 1000000) / 1000);
    let cientos = n % 1000;

    let resultado = "";

    if (millones > 0) resultado += (millones === 1 ? "UN MILLÓN " : convertir(millones) + " MILLONES ");
    if (miles > 0) resultado += (miles === 1 ? "MIL " : convertir(miles) + " MIL ");

    if (cientos > 0) {
      let c = Math.floor(cientos / 100);
      let d = Math.floor((cientos % 100) / 10);
      let u = cientos % 10;

      if (c > 0) resultado += CENTENAS[c] + " ";

      if (d === 1 && u > 0) {
        resultado += ["DIEZ", "ONCE", "DOCE", "TRECE", "CATORCE", "QUINCE"][u] + " ";
      } else {
        if (d > 0) resultado += DECENAS[d] + (u > 0 ? " Y " : " ");
        if (u > 0) resultado += UNIDADES[u] + " ";
      }
    }
    return resultado.trim();
  }

  return convertir(n) + " PESOS";
}

async function generarCertificado() {
  try {
  const { nombre, cedula, cargo, ingreso, salario, transporte, rodamiento, comisiones } = empleado;

  const fechaActual = new Date().toLocaleDateString("es-CO", {
    year: 'numeric', month: 'long', day: 'numeric'
  });

  const ingresoFecha = parseFechaCO(ingreso).toLocaleDateString("es-CO", {
    year: 'numeric', month: 'long', day: 'numeric'
  });

  const existingPdfBytes = await fetch("certificado_base.pdf").then(res => res.arrayBuffer());
  const pdfDoc = await PDFLib.PDFDocument.load(existingPdfBytes);
  const page = pdfDoc.getPages()[0];
  const pageW = page.getWidth();
  const pageH = page.getHeight();

  const font = await pdfDoc.embedFont(PDFLib.StandardFonts.TimesRoman);
  const fontBold = await pdfDoc.embedFont(PDFLib.StandardFonts.TimesRomanBold);

  const left = 85;
  const right = pageW - 85;
  const maxWidth = right - left;
  const fontSize = 10;
  const lineHeight = 15.5;

  let y = 660;

  function textWidth(t, f = font, s = fontSize) {
    return f.widthOfTextAtSize(t, s);
  }

  function drawJustified(text, options = {}) {
    const size = options.size || fontSize;
    const f = options.bold ? fontBold : font;
    const words = text.split(" ");
    let line = "";

    function flushLine(lineText, isLast) {
      const trimmed = lineText.trim();
      if (!trimmed) return;
      const lineWidth = textWidth(trimmed, f, size);
      let drawOpts = { x: left, y, size, font: f, color: PDFLib.rgb(0.1, 0.1, 0.1) };

      if (options.center) {
        drawOpts.x = left + (maxWidth - lineWidth) / 2;
      } else if (options.right) {
        drawOpts.x = right - lineWidth;
      } else if (!isLast && trimmed.split(" ").length > 1) {
        const spaceWidth = textWidth(" ", f, size);
        const extra = (maxWidth - lineWidth) / (trimmed.split(" ").length - 1);
        drawOpts.wordSpacing = Math.max(extra, 0);
      }

      page.drawText(trimmed, drawOpts);
      y -= lineHeight;
    }

    for (let i = 0; i < words.length; i++) {
      const testLine = line + words[i] + " ";
      if (textWidth(testLine.trim(), f, size) > maxWidth && line.trim()) {
        flushLine(line, false);
        line = words[i] + " ";
      } else {
        line = testLine;
      }
    }
    if (line.trim()) flushLine(line, true);

    y -= (options.extraY || 10);
  }

  // ============ ENCABEZADO ============
  drawJustified(`Sabaneta, ${fechaActual}`, { right: true, extraY: 22 });

  drawJustified("CERTIFICADO LABORAL", { center: true, bold: true, size: 13, extraY: 16 });

  drawJustified("A QUIEN PUEDA INTERESAR", { center: true, extraY: 24 });

  // ============ CUERPO ============
  const genero = (empleado.genero || '').toString().trim().toUpperCase();
  const esMujer = genero === 'F' || genero === 'FEMENINO' || genero === 'MUJER' || genero === 'FEM';
  const articulo = esMujer ? 'la' : 'el';
  const tratamiento = esMujer ? 'señora' : 'señor';
  const idTratamiento = esMujer ? 'identificada' : 'identificado';

  drawJustified(
    `ANDRÉS RAÍZ INMOBILIARIA S.A.S., con NIT 901524934, certifica que ${articulo} ${tratamiento} ${nombre}, ${idTratamiento} con cédula de ciudadanía No. ${cedula}, labora en nuestra compañía desde el ${ingresoFecha} hasta la fecha, bajo el cargo de ${cargo}, mediante contrato a término indefinido.`,
    { extraY: 20 }
  );

  let remuneracion =
    `Su remuneración se compone de: salario básico de ${enLetras(salario)} (${numeroATexto(salario)})`;

  if (transporte > 0)
    remuneracion += `, auxilio de transporte de ${enLetras(transporte)} (${numeroATexto(transporte)})`;

  if (rodamiento > 0)
    remuneracion += `, auxilio de rodamiento de ${enLetras(rodamiento)} (${numeroATexto(rodamiento)})`;

  if (comisiones > 0)
    remuneracion += `, recibe a la fecha un promedio de salario variable de ${enLetras(comisiones)} (${numeroATexto(comisiones)})`;

  remuneracion += ".";

  drawJustified(remuneracion, { extraY: 20 });

  drawJustified(
    `Este certificado se expide a solicitud del interesado, para los fines que estime convenientes. Para cualquier información adicional, puede comunicarse al correo servicio@andresraiz.com o a los teléfonos 604-358 06 70 y 304 589 0460.`,
    { extraY: 20 }
  );

  const pdfBytes = await pdfDoc.save();
  const blob = new Blob([pdfBytes], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);

  const esMovil = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && window.innerWidth < 800);

  if (esMovil) {
    const a = document.createElement('a');
    a.href = url;
    a.download = `Certificado_${nombre}.pdf`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  } else {
    document.getElementById('visor').style.display = 'block';
    document.getElementById('visor').removeAttribute('srcdoc');
    document.getElementById('visor').src = url;
  }

  const boton = document.getElementById('btnDescargar');
  boton.style.display = 'block';

  boton.onclick = () => {
    const a = document.createElement('a');
    a.href = url;
    a.download = `Certificado_${nombre}.pdf`;
    a.click();
  };
  } catch (error) {
    const visor = document.getElementById('visor');
    visor.style.display = 'block';
    visor.srcdoc = `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;font-family:Segoe UI,sans-serif;color:#555;">
        <div style="font-size:48px;margin-bottom:10px;">⚠️</div>
        <h2 style="margin:0;color:#c0392b;">Error al generar certificado</h2>
        <p style="margin-top:8px;">No se pudo generar el certificado. Intente de nuevo.</p>
        <button onclick="parent.document.getElementById('visor').style.display='none'" style="margin-top:15px;padding:10px 20px;border:none;border-radius:8px;background:#f06c00;color:white;cursor:pointer;font-size:14px;">Cerrar</button>
      </div>
    `;
  }
}

function abrirSolicitudVacaciones() {
  document.getElementById('modalVacaciones').style.display = 'flex';
  resetBtnEnviar();
  cargarDisponiblesVacaciones();
  var hoy = new Date().toISOString().split('T')[0];
  document.getElementById('vacFechaInicio').value = '';
  document.getElementById('vacFechaInicio').min = hoy;
  document.getElementById('vacDiasInfo').style.display = 'none';
  cargarHistorialSolicitudes();
}

function cerrarModalVacaciones() {
  document.getElementById('modalVacaciones').style.display = 'none';
}

function onSelectFechaInicio() {
  var inicio = document.getElementById('vacFechaInicio').value;
  if (!inicio) return;
  var dInicio = new Date(inicio);
  var diaSemana = dInicio.getDay();
  if (diaSemana !== 1) {
    var diasHastaLunes = (8 - diaSemana) % 7;
    if (diasHastaLunes === 0) diasHastaLunes = 7;
    dInicio.setDate(dInicio.getDate() + diasHastaLunes);
    document.getElementById('vacFechaInicio').value = dInicio.toISOString().split('T')[0];
  }
  document.getElementById('vacDiasInfo').style.display = 'block';
}

async function cargarDisponiblesVacaciones() {
  const url = VAC_SCRIPT_URL + '?clave=' + CLAVE_SECRETA + '&action=disponibles&cedula=' + encodeURIComponent(empleado.cedula);
  try {
    const data = await jsonpFetch(url);
    document.getElementById('vacDispDisponibles').innerText = data.disponibles || 0;
    document.getElementById('vacDispTomadas').innerText = data.tomadas || 0;
    document.getElementById('vacDispAcumuladas').innerText = data.acumuladas || 0;
    document.getElementById('vacDispColectivas').innerText = data.colectivas || 0;
  } catch(e) {
    const fechaIngreso = parseFechaCO(empleado.ingreso);
    const hoy = new Date();
    const meses = (hoy.getFullYear() - fechaIngreso.getFullYear()) * 12 + (hoy.getMonth() - fechaIngreso.getMonth());
    const acumuladas = Math.floor((15 / 12) * meses);
    const tomadas = parseInt(empleado.vacaciones || 0);
    const disponibles = Math.max(acumuladas - tomadas, 0);
    document.getElementById('vacDispDisponibles').innerText = disponibles;
    document.getElementById('vacDispTomadas').innerText = tomadas;
    document.getElementById('vacDispAcumuladas').innerText = acumuladas;
    document.getElementById('vacDispColectivas').innerText = 0;
  }
}

function cargarVacacionesColectivas() {
  var url = VAC_SCRIPT_URL + '?clave=' + CLAVE_SECRETA + '&action=vacaciones_colectivas';
  jsonpFetch(url).then(function(data) {
    if (!data.data || data.data.length === 0) return;
    var hoy = new Date();
    var proximas = data.data.filter(function(vc) {
      var fin = new Date(vc['Fecha Fin'] || vc['Fecha fin'] || '');
      return fin >= hoy;
    });
    if (proximas.length === 0) return;
    document.getElementById('vacacionesColectivasCard').style.display = 'block';
    document.getElementById('listaColectivas').innerHTML = proximas.map(function(vc) {
      var inicio = vc['Fecha Inicio'] || vc['Fecha inicio'] || '';
      var fin = vc['Fecha Fin'] || vc['Fecha fin'] || '';
      var dias = vc['Días'] || vc['Dias'] || 7;

        '<div><b>' + inicio + ' — ' + fin + '</b><br><span style="font-size:12px;color:#888;">' + dias + ' días — aplica a todos los empleados</span></div>' +

}

function enviarSolicitudVacaciones() {
  var btn = document.getElementById('btnEnviarSolicitud');
  if (btn.disabled) return;
  btn.disabled = true;
  btn.innerHTML = 'Enviando...';

  var fechaInicio = document.getElementById('vacFechaInicio').value;
  var motivo = document.getElementById('vacMotivo').value.trim();

  if (!fechaInicio) { alert('Selecciona la semana de vacaciones'); resetBtnEnviar(); return; }
  if (!motivo) { alert('Escribe el motivo de tu solicitud'); resetBtnEnviar(); return; }

  var dInicio = new Date(fechaInicio);
  var dFin = new Date(dInicio);

}

function jsonpFetch(url) {
  return new Promise(function(resolve, reject) {
    var cbName = 'jsonp_cb_' + Math.random().toString(36).substr(2);
    var sep = url.includes('?') ? '&' : '?';
    var script = document.createElement('script');
    window[cbName] = function(data) {
      delete window[cbName];
      document.body.removeChild(script);
      resolve(data);
    };
    script.src = url + sep + 'callback=' + cbName;
    script.onerror = function() {
      delete window[cbName];
      document.body.removeChild(script);
      reject(new Error('JSONP request failed'));
    };
    document.body.appendChild(script);
  });
}

function cargarHistorialSolicitudes() {
  var container = document.getElementById('listaSolicitudes');

  var url = VAC_SCRIPT_URL + '?clave=' + CLAVE_SECRETA + '&action=solicitudes&cedula=' + encodeURIComponent(empleado.cedula);

  jsonpFetch(url).then(function(data) {
    if (!data.data || data.data.length === 0) {
      container.innerHTML = '<p class="vac-empty">No hay solicitudes registradas</p>';
    } else {
      var solicitudes = data.data.slice().reverse();
      container.innerHTML = solicitudes.map(function(s) {
        var estadoClass = 'vac-estado-pendiente';
        var estadoIcono = '\u23F3';
        if (s.Estado === 'Aprobada') { estadoClass = 'vac-estado-aprobada'; estadoIcono = '\u2705'; }
        if (s.Estado === 'Rechazada') { estadoClass = 'vac-estado-rechazada'; estadoIcono = '\u274C'; }
        return '<div class="vac-solicitud-item">' +
          '<div class="vac-solicitud-top">' +
            '<span class="vac-solicitud-fechas">' + (s['Fecha Inicio']||'') + ' - ' + (s['Fecha Fin']||'') + '</span>' +
            '<span class="vac-solicitud-dias">' + (s['Días'] || s.Dias || '') + ' días</span>' +
          '</div>' +
          '<div class="vac-solicitud-motivo">' + (s.Motivo||'') + '</div>' +
          '<div class="vac-solicitud-bottom">' +
            '<span class="vac-solicitud-fecha">Solicitado: ' + (s['Fecha Solicitud']||'') + '</span>' +
            '<span class="vac-solicitud-estado ' + estadoClass + '">' + estadoIcono + ' ' + (s.Estado||'') + '</span>' +
          '</div>' +
          (s.Observaciones ? '<div class="vac-solicitud-obs"><b>Observaciones:</b> ' + s.Observaciones + '</div>' : '') +
        '</div>';
      }).join('');
    }
  }).catch(function() {
    container.innerHTML = '<p class="vac-empty">No hay solicitudes registradas</p>';
  });
}

// Cargar historial al entrar al dashboard
cargarHistorialSolicitudes();
cargarVacacionesColectivas();
</script>
